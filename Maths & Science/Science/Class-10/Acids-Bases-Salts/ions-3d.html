<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Ion Lab: Neutralisation | AIkiPadhai</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../sci-3d.js"></script>
</head>

<body>
    <script>
        var C = { H: 0xf87171, Cl: 0x4ade80, Na: 0xa855f7, O: 0xef4444, OH: 0x38bdf8 };

        Sci3D({
            title: "🧊 3D Ion Lab: Neutralisation",
            back: { href: "neutralisation-salts.html", label: "Back to Lesson" },
            intro: {
                name: "3D Ion Lab",
                desc: "HCl aur NaOH paani mein ions mein toot jaate hain. 'Reaction' slider ko dheere-dheere ghumao — dekho H⁺ aur OH⁻ milkar paani (H₂O) banate hain, aur Na⁺ aur Cl⁻ bachkar salt (NaCl) ban jaate hain. Left sidebar se koi bhi ion chuno."
            },
            camZ: 26,
            data: {
                hplus: {
                    emoji: "🔴", name: "H⁺ ion", nick: "Acid ka dil",
                    desc: "Hydrogen ion. HCl paani mein ghulkar ye deta hai — isiliye HCl acid hai. Jitne zyada H⁺, utna kam pH aur utna zyada acidic.",
                    stats: [["Charge", "+1"], ["Kahan se", "HCl se"], ["Acid ka lakshan", "Haan"], ["pH par asar", "pH ghataata hai"]]
                },
                clminus: {
                    emoji: "🟢", name: "Cl⁻ ion", nick: "Spectator",
                    desc: "Chloride ion. Ye reaction mein hissa nahi leta — bas dekhta rehta hai (isliye 'spectator ion'). Aakhir mein Na⁺ ke saath milkar namak banata hai.",
                    stats: [["Charge", "−1"], ["Kahan se", "HCl se"], ["Reaction mein", "Spectator"], ["Ant mein", "NaCl ka hissa"]]
                },
                naplus: {
                    emoji: "🟣", name: "Na⁺ ion", nick: "Spectator",
                    desc: "Sodium ion. Ye bhi spectator hai. NaOH se aata hai aur aakhir mein Cl⁻ ke saath milkar khane wala namak (NaCl) banata hai.",
                    stats: [["Charge", "+1"], ["Kahan se", "NaOH se"], ["Reaction mein", "Spectator"], ["Ant mein", "NaCl ka hissa"]]
                },
                ohminus: {
                    emoji: "🔵", name: "OH⁻ ion", nick: "Base ka dil",
                    desc: "Hydroxide ion. NaOH paani mein ghulkar ye deta hai — isiliye NaOH base hai. Ye H⁺ ko pakadkar paani bana deta hai.",
                    stats: [["Charge", "−1"], ["Kahan se", "NaOH se"], ["Base ka lakshan", "Haan"], ["pH par asar", "pH badhata hai"]]
                },
                water: {
                    emoji: "💧", name: "H₂O (paani)", nick: "Asli product",
                    desc: "Neutralisation ka asli product! H⁺ + OH⁻ → H₂O. Yahi wo reaction hai jo acid aur base dono ka asar khatm kar deti hai. Ye exothermic hai — garmi nikalti hai.",
                    stats: [["Bana", "H⁺ + OH⁻ se"], ["Charge", "0 (neutral)"], ["Reaction", "Exothermic"], ["pH", "7"]]
                },
                salt: {
                    emoji: "🧂", name: "NaCl (namak)", nick: "Doosra product",
                    desc: "Sodium chloride — khane wala namak. Na⁺ aur Cl⁻ ions ke aakarshan se banta hai. Strong acid + strong base se bana hai, isliye ye NEUTRAL salt hai (pH = 7).",
                    stats: [["Bana", "Na⁺ + Cl⁻ se"], ["pH", "7 (neutral)"], ["Type", "Strong acid + strong base"], ["Rozmarra", "Khane ka namak"]]
                }
            },
            controls: [
                { id: "prog", label: "⚗️ Reaction progress (ions → paani + namak)", min: 0, max: 100, step: 1, value: 0, on: function (v, ctx) { ctx.model.p = v / 100; } },
                { id: "auto", label: "🔁 Auto-play (0 = off, 1 = on)", min: 0, max: 1, step: 1, value: 0, on: function (v, ctx) { ctx.model.auto = (v === 1); } }
            ],
            build: function (ctx) {
                var T = ctx.THREE, P = ctx.pivot, M = ctx.model;
                M.p = 0; M.auto = false; M.items = [];

                var grid = new T.GridHelper(40, 20, 0x475569, 0x334155); grid.position.y = -9; P.add(grid);

                function ion(el, key, start, end, r) {
                    var m = new T.Mesh(new T.SphereGeometry(r, 20, 16), ctx.mat(C[el]));
                    m.userData.a = start; m.userData.b = end;
                    ctx.addPart(m, key); P.add(m); M.items.push(m);
                    return m;
                }
                // 3 pairs so the pattern is obvious
                for (var i = 0; i < 3; i++) {
                    var y = 4 - i * 4;
                    // H+ starts left, ends paired with OH- in the middle-right (as water)
                    ion('H', 'hplus', [-10, y + 0.6, 0], [4.2, y + 0.9, 0], 0.5);
                    // OH- starts right, ends as the O of that water
                    ion('OH', 'ohminus', [10, y + 0.6, 0], [5.2, y + 0.2, 0], 0.72);
                    // Cl- starts left, drifts down-left to form salt
                    ion('Cl', 'clminus', [-10, y - 1.2, 0], [-6.0, y - 0.6, 0], 0.78);
                    // Na+ starts right, joins Cl-
                    ion('Na', 'naplus', [10, y - 1.2, 0], [-4.4, y - 0.6, 0], 0.66);
                }
                P.rotation.x = 0.12;
            },
            onFrame: function (t, ctx) {
                var M = ctx.model; if (!M.items) return;
                if (M.auto) { M.p += 0.005; if (M.p > 1.3) M.p = -0.3; }
                var p = Math.max(0, Math.min(1, M.p));
                var e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
                M.items.forEach(function (m, i) {
                    var a = m.userData.a, b = m.userData.b;
                    m.position.x = a[0] + (b[0] - a[0]) * e;
                    m.position.y = a[1] + (b[1] - a[1]) * e;
                    m.position.z = a[2] + (b[2] - a[2]) * e + Math.sin(e * Math.PI) * (i % 2 ? 1.2 : -1.2);
                });
            }
        });
    </script>
</body>

</html>
