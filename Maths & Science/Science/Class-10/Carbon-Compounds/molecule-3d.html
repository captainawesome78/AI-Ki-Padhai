<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Covalent Molecule Lab | AIkiPadhai</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../sci-3d.js"></script>
</head>

<body>
    <script>
        var EL = {
            C: { col: 0x334155, r: 0.62, name: "Carbon" },
            H: { col: 0xf1f5f9, r: 0.34, name: "Hydrogen" },
            O: { col: 0xef4444, r: 0.55, name: "Oxygen" },
            Cl: { col: 0x22c55e, r: 0.70, name: "Chlorine" },
            N: { col: 0x3b82f6, r: 0.56, name: "Nitrogen" }
        };
        var T1 = 0.63;   // tetrahedral unit offset

        /* atoms:[el,x,y,z]  bonds:[i,j,order] */
        var MOL = {
            methane: {
                nm: "Methane (CH₄)", sub: "Alkane • tetrahedral 109.5°",
                atoms: [["C", 0, 0, 0], ["H", T1, T1, T1], ["H", -T1, -T1, T1], ["H", -T1, T1, -T1], ["H", T1, -T1, -T1]],
                bonds: [[0, 1, 1], [0, 2, 1], [0, 3, 1], [0, 4, 1]],
                note: "Carbon ke 4 bonds ek tal mein nahi — 3D tetrahedron banate hain, har bond ke beech 109.5°."
            },
            ethane: {
                nm: "Ethane (C₂H₆)", sub: "Alkane • C—C single bond",
                atoms: [["C", -0.77, 0, 0], ["C", 0.77, 0, 0],
                ["H", -1.16, 1.02, 0], ["H", -1.16, -0.51, 0.88], ["H", -1.16, -0.51, -0.88],
                ["H", 1.16, -1.02, 0], ["H", 1.16, 0.51, 0.88], ["H", 1.16, 0.51, -0.88]],
                bonds: [[0, 1, 1], [0, 2, 1], [0, 3, 1], [0, 4, 1], [1, 5, 1], [1, 6, 1], [1, 7, 1]],
                note: "Do carbon single bond se jude. Ye SATURATED hai — koi khaali jagah nahi, isliye sirf substitution."
            },
            ethene: {
                nm: "Ethene (C₂H₄)", sub: "Alkene • C=C double bond",
                atoms: [["C", -0.67, 0, 0], ["C", 0.67, 0, 0],
                ["H", -1.23, 0.93, 0], ["H", -1.23, -0.93, 0], ["H", 1.23, 0.93, 0], ["H", 1.23, -0.93, 0]],
                bonds: [[0, 1, 2], [0, 2, 1], [0, 3, 1], [1, 4, 1], [1, 5, 1]],
                note: "DOUBLE bond! Ye UNSATURATED hai. Do bonds ka matlab yahan addition reaction ho sakti hai. Ye anu CHAPTA (planar) hai."
            },
            ethyne: {
                nm: "Ethyne (C₂H₂)", sub: "Alkyne • C≡C triple bond",
                atoms: [["C", -0.6, 0, 0], ["C", 0.6, 0, 0], ["H", -1.66, 0, 0], ["H", 1.66, 0, 0]],
                bonds: [[0, 1, 3], [0, 2, 1], [1, 3, 1]],
                note: "TRIPLE bond — sabse majboot aur sabse chhota. Ye anu bilkul SEEDHA (linear) hai. Welding mein use hota hai."
            },
            ethanol: {
                nm: "Ethanol (C₂H₅OH)", sub: "Alcohol • —OH group",
                atoms: [["C", -1.2, 0, 0], ["C", 0.25, 0, 0], ["O", 1.0, 1.1, 0], ["H", 1.95, 1.0, 0],
                ["H", -1.6, 1.0, 0], ["H", -1.6, -0.5, 0.87], ["H", -1.6, -0.5, -0.87],
                ["H", 0.6, -0.55, 0.88], ["H", 0.6, -0.55, -0.88]],
                bonds: [[0, 1, 1], [1, 2, 1], [2, 3, 1], [0, 4, 1], [0, 5, 1], [0, 6, 1], [1, 7, 1], [1, 8, 1]],
                note: "—OH functional group isse ALCOHOL banata hai. Isi group ki wajah se iska naam '-ol' par khatm hota hai."
            },
            acid: {
                nm: "Ethanoic acid (CH₃COOH)", sub: "Carboxylic acid • —COOH",
                atoms: [["C", -1.3, 0, 0], ["C", 0.2, 0, 0], ["O", 0.85, 1.1, 0], ["O", 0.85, -1.1, 0], ["H", 1.8, -1.1, 0],
                ["H", -1.7, 1.0, 0], ["H", -1.7, -0.5, 0.87], ["H", -1.7, -0.5, -0.87]],
                bonds: [[0, 1, 1], [1, 2, 2], [1, 3, 1], [3, 4, 1], [0, 5, 1], [0, 6, 1], [0, 7, 1]],
                note: "—COOH group! Dhyan do: isme ek C=O double bond aur ek C—O—H hai. Ye group compound ko ACID banata hai (sirka)."
            },
            water: {
                nm: "Water (H₂O)", sub: "Bent • 104.5°",
                atoms: [["O", 0, 0, 0], ["H", 0.76, 0.59, 0], ["H", -0.76, 0.59, 0]],
                bonds: [[0, 1, 1], [0, 2, 1]],
                note: "Paani seedha nahi — MUDA HUA (bent) hai. Isi shape ki wajah se paani polar hai aur itni cheezein ghula leta hai."
            },
            butane: {
                nm: "n-Butane (C₄H₁₀)", sub: "Isomer 1 • seedhi chain",
                atoms: [["C", -2.3, -0.3, 0], ["C", -0.77, 0.3, 0], ["C", 0.77, -0.3, 0], ["C", 2.3, 0.3, 0]],
                bonds: [[0, 1, 1], [1, 2, 1], [2, 3, 1]],
                note: "SEEDHI CHAIN — 4 carbon ek line mein. (Hydrogen chhupaye gaye hain taaki chain saaf dikhe.) Isi ka formula C₄H₁₀ hai."
            },
            isobutane: {
                nm: "Isobutane (C₄H₁₀)", sub: "Isomer 2 • shakha wali",
                atoms: [["C", 0, 0, 0], ["C", -1.5, 0.55, 0], ["C", 1.5, 0.55, 0], ["C", 0, -1.55, 0]],
                bonds: [[0, 1, 1], [0, 2, 1], [0, 3, 1]],
                note: "SHAKHA (BRANCH) WALI — beech wale carbon se teen carbon jude hain. Formula WAHI C₄H₁₀, par structure alag — isiliye ye ISOMER hai! Iska B.P. bhi alag hai."
            }
        };
        var KEYS = Object.keys(MOL);

        Sci3D({
            title: "🧊 3D Covalent Molecule Lab",
            back: { href: "covalent-bond.html", label: "Back to Lesson" },
            intro: {
                name: "3D Molecule Lab",
                desc: "9 molecules ek lab mein! 'Molecule' slider se koi bhi chuno — methane ki tetrahedral shape, double/triple bond, functional groups, aur butane vs isobutane (isomers). 'View' slider se ball-stick ya space-filling. 'Bond pairs' se share hote electrons dekho."
            },
            camZ: 13,
            data: {
                carbon: { emoji: "⚫", name: "Carbon (C)", nick: "4 bonds hamesha", desc: "Carbon hamesha 4 covalent bonds banata hai (tetravalency). Isiliye wo lambi chains, branches aur rings bana sakta hai — yahi carbon ki versatility hai.", stats: [["Electrons", "2, 4"], ["Bonds", "4 (hamesha)"], ["Shape", "Tetrahedral"], ["Bond angle", "109.5°"]] },
                hydrogen: { emoji: "⚪", name: "Hydrogen (H)", nick: "1 bond", desc: "Hydrogen sirf 1 bond banata hai — usse sirf 2 electrons chahiye (duplet), 8 nahi. Isliye ye hamesha chain ke sire par hota hai.", stats: [["Electrons", "1"], ["Bonds", "1"], ["Chahiye", "2 electrons (duplet)"]] },
                oxygen: { emoji: "🔴", name: "Oxygen (O)", nick: "2 bonds", desc: "Oxygen 2 bonds banata hai — ya do single, ya ek double. Alcohol (—OH) aur acid (—COOH) dono mein yahi hai.", stats: [["Electrons", "2, 6"], ["Bonds", "2"], ["Milta hai", "—OH, —CHO, —COOH mein"]] },
                bond1: { emoji: "➖", name: "Single bond", nick: "1 pair share", desc: "Ek electron pair share hota hai. Sabse lamba aur sabse kamzor bond. Saturated compounds mein sirf yahi hota hai — isliye wo addition reaction nahi kar sakte.", stats: [["Shared pairs", "1"], ["Taakat", "Sabse kam"], ["Lambai", "Sabse zyada"], ["Milta hai", "Alkanes"]] },
                bond2: { emoji: "🟰", name: "Double bond", nick: "2 pairs share", desc: "Do electron pairs share hote hain. Ye UNSATURATED banata hai — yahan addition reaction ho sakti hai (jaise hydrogenation se vanaspati ghee).", stats: [["Shared pairs", "2"], ["Taakat", "Zyada"], ["Lambai", "Chhota"], ["Milta hai", "Alkenes, C=O"]] },
                bond3: { emoji: "🎽", name: "Triple bond", nick: "3 pairs share", desc: "Teen electron pairs share hote hain — sabse majboot aur sabse chhota bond. Anu ko SEEDHA (linear) bana deta hai.", stats: [["Shared pairs", "3"], ["Taakat", "Sabse zyada"], ["Lambai", "Sabse chhota"], ["Milta hai", "Alkynes, N₂"]] },
                pair: { emoji: "⚡", name: "Shared electron pair", nick: "Covalent bond ka dil", desc: "Peele daane = share kiye gaye electrons. Ionic bond mein electron POORI TARAH transfer hota hai, par covalent mein wo DONO atoms ke beech rehta hai — dono use apna maante hain.", stats: [["Kitne electrons", "2 per pair"], ["Kiska", "Dono atoms ka"], ["Ionic se farak", "Transfer nahi, sharing"]] }
            },
            controls: [
                { id: "mol", label: "🧪 Molecule (0-8)", min: 0, max: 8, step: 1, value: 0, on: function (v, ctx) { ctx.model.setMol(v); } },
                { id: "view", label: "👁️ View: 0=Ball-stick, 1=Space-filling", min: 0, max: 1, step: 1, value: 0, on: function (v, ctx) { ctx.model.space = (v === 1); ctx.model.apply(); } },
                { id: "pairs", label: "⚡ Shared electron pairs dikhao", min: 0, max: 1, step: 1, value: 1, on: function (v, ctx) { ctx.model.showP = (v === 1); ctx.model.apply(); } }
            ],
            build: function (ctx) {
                var T = ctx.THREE, P = ctx.pivot, M = ctx.model;
                M.space = false; M.showP = true; M.cur = 'methane';
                M.grp = new T.Group(); P.add(M.grp);

                M.setMol = function (v) {
                    M.cur = KEYS[v];
                    while (M.grp.children.length) M.grp.remove(M.grp.children[0]);
                    var mol = MOL[M.cur];
                    M.spheres = []; M.sticks = []; M.dots = [];

                    // atoms
                    mol.atoms.forEach(function (a) {
                        var el = EL[a[0]];
                        var m = new T.Mesh(new T.SphereGeometry(el.r, 22, 16), ctx.mat(el.col));
                        m.position.set(a[1], a[2], a[3]);
                        m.userData.baseR = el.r;
                        var key = a[0] === 'C' ? 'carbon' : a[0] === 'H' ? 'hydrogen' : a[0] === 'O' ? 'oxygen' : 'carbon';
                        ctx.addPart(m, key);
                        M.grp.add(m); M.spheres.push(m);
                    });

                    // bonds
                    mol.bonds.forEach(function (b) {
                        var a1 = mol.atoms[b[0]], a2 = mol.atoms[b[1]], order = b[2];
                        var p1 = new T.Vector3(a1[1], a1[2], a1[3]);
                        var p2 = new T.Vector3(a2[1], a2[2], a2[3]);
                        var dx = p2.x - p1.x, dy = p2.y - p1.y, dz = p2.z - p1.z;
                        var len = Math.sqrt(dx * dx + dy * dy + dz * dz);
                        // perpendicular offset direction for multi-bonds
                        var ox = 0, oy = 0, oz = 0;
                        if (Math.abs(dy) < 0.9 * len) { oy = 1; } else { ox = 1; }
                        // gram-schmidt: make perpendicular
                        var dot = (ox * dx + oy * dy + oz * dz) / (len * len);
                        var px = ox - dot * dx, py = oy - dot * dy, pz = oz - dot * dz;
                        var pl = Math.sqrt(px * px + py * py + pz * pz) || 1;
                        px /= pl; py /= pl; pz /= pl;

                        var seps = order === 1 ? [0] : order === 2 ? [-0.14, 0.14] : [-0.2, 0, 0.2];
                        var bkey = order === 1 ? 'bond1' : order === 2 ? 'bond2' : 'bond3';
                        seps.forEach(function (s) {
                            var st = new T.Mesh(new T.CylinderGeometry(0.075, 0.075, len, 10), ctx.mat(0x94a3b8));
                            st.position.set((p1.x + p2.x) / 2 + px * s, (p1.y + p2.y) / 2 + py * s, (p1.z + p2.z) / 2 + pz * s);
                            st.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), new T.Vector3(dx / len, dy / len, dz / len));
                            ctx.addPart(st, bkey); M.grp.add(st); M.sticks.push(st);
                        });
                        // shared electron dots sitting in the bond
                        for (var k = 0; k < order; k++) {
                            [-0.13, 0.13].forEach(function (t2) {
                                var d = new T.Mesh(new T.SphereGeometry(0.105, 8, 8), ctx.mat(0xfde047));
                                var s2 = seps[k] || 0;
                                d.position.set(
                                    (p1.x + p2.x) / 2 + px * s2 + (dx / len) * t2,
                                    (p1.y + p2.y) / 2 + py * s2 + (dy / len) * t2,
                                    (p1.z + p2.z) / 2 + pz * s2 + (dz / len) * t2);
                                ctx.addPart(d, 'pair'); M.grp.add(d); M.dots.push(d);
                            });
                        }
                    });
                    M.apply();
                    ctx.selectKey('carbon');
                };

                M.apply = function () {
                    if (!M.spheres) return;
                    M.spheres.forEach(function (s) {
                        s.scale.setScalar(M.space ? 2.6 : 1);
                    });
                    M.sticks.forEach(function (s) { s.visible = !M.space; });
                    M.dots.forEach(function (d) { d.visible = M.showP && !M.space; });
                };

                M.setMol(0);
                P.rotation.x = 0.18;
            },
            onFrame: function (t, ctx) {
                var M = ctx.model;
                if (M.dots) M.dots.forEach(function (d, i) {
                    d.scale.setScalar(1 + Math.sin(t * 3 + i) * 0.14);
                });
            }
        });
    </script>
</body>

</html>
