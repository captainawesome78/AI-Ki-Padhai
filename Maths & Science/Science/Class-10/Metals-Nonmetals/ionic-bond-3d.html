<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Ionic Bond &amp; Crystal Lattice | AIkiPadhai</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../sci-3d.js"></script>
</head>

<body>
    <script>
        var COL = { na: 0xa855f7, cl: 0x22c55e, naIon: 0xc084fc, clIon: 0x4ade80, e: 0xfde047, shell: 0x64748b };

        Sci3D({
            title: "🧊 3D Ionic Bond &amp; Crystal Lattice",
            back: { href: "ionic-compounds.html", label: "Back to Lesson" },
            intro: {
                name: "3D Ionic Bond Lab",
                desc: "Teen scene ek lab mein! Scene slider: 0 = ATOMS (electron shells dekho), 1 = TRANSFER (peela electron Na se Cl jaate hue), 2 = LATTICE (poora namak ka crystal). Lattice size aur explode se crystal ko kholo. Left sidebar se koi bhi hissa chuno."
            },
            camZ: 26,
            data: {
                na: {
                    emoji: "🟣", name: "Sodium atom (Na)", nick: "2, 8, 1",
                    desc: "Sodium ke bahri shell mein sirf 1 electron hai. 7 aur lena bahut mushkil, isliye wo 1 electron DE dena pasand karta hai — tab uske paas 2,8 bachta hai jo stable hai.",
                    stats: [["Atomic number", "11"], ["Electrons", "2, 8, 1"], ["Bahri shell", "1 electron"], ["Kya karega", "1 electron DEGA"]]
                },
                cl: {
                    emoji: "🟢", name: "Chlorine atom (Cl)", nick: "2, 8, 7",
                    desc: "Chlorine ke bahri shell mein 7 electrons hain — sirf 1 aur chahiye octet poora karne ke liye. Isliye wo electron LE leta hai.",
                    stats: [["Atomic number", "17"], ["Electrons", "2, 8, 7"], ["Bahri shell", "7 electrons"], ["Kya karega", "1 electron LEGA"]]
                },
                electron: {
                    emoji: "⚡", name: "Transfer hone wala electron", nick: "Kahani ka hero",
                    desc: "Yahi wo ek electron hai jo Na se nikalkar Cl mein jaata hai. Iske jaate hi Na positive (Na⁺) aur Cl negative (Cl⁻) ho jaata hai — aur yahi ionic bond ki jad hai.",
                    stats: [["Charge", "−1"], ["Kahan se", "Na ka bahri shell"], ["Kahan tak", "Cl ka bahri shell"], ["Nateeja", "Na⁺ aur Cl⁻"]]
                },
                naIon: {
                    emoji: "➕", name: "Na⁺ ion (cation)", nick: "Electron dene ke baad",
                    desc: "Electron dene ke baad Na ke paas 11 protons par sirf 10 electrons bache — isliye +1 charge. Dhyan do: ion apne atom se SIZE mein CHHOTA ho gaya, kyunki ek poora shell hi chala gaya!",
                    stats: [["Charge", "+1"], ["Electrons ab", "2, 8 (stable)"], ["Size", "Atom se chhota"], ["Naam", "Cation"]]
                },
                clIon: {
                    emoji: "➖", name: "Cl⁻ ion (anion)", nick: "Electron lene ke baad",
                    desc: "Electron lene ke baad Cl ke paas 17 protons par 18 electrons — isliye −1 charge. Ye apne atom se SIZE mein BADA ho gaya, kyunki extra electron se prati-karshan badh gaya.",
                    stats: [["Charge", "−1"], ["Electrons ab", "2, 8, 8 (stable)"], ["Size", "Atom se bada"], ["Naam", "Anion"]]
                },
                lattice: {
                    emoji: "🧂", name: "NaCl Crystal Lattice", nick: "Asli structure",
                    desc: "Ye sabse zaroori baat hai! NaCl mein 'ek Na + ek Cl ka molecule' hota hi nahi. Laakhon ions ek 3D jaali mein sajey hote hain — har Na⁺ ke charon taraf 6 Cl⁻, aur har Cl⁻ ke charon taraf 6 Na⁺.",
                    stats: [["Structure", "Face-centred cubic"], ["Har ion ke padosi", "6"], ["Melting point", "801 °C"], ["Formula NaCl ka matlab", "1:1 anupat, molecule nahi"]]
                },
                bond: {
                    emoji: "🔗", name: "Ionic Bond", nick: "Ulta charge = aakarshan",
                    desc: "Na⁺ (+) aur Cl⁻ (−) ke ulte charge unhe zor se kheenchte hain — yahi ionic bond hai. Ye itna majboot hai ki NaCl ko pighlane ke liye 801°C chahiye, aur thos halat mein ions hil na paane ki wajah se bijli conduct nahi hoti.",
                    stats: [["Bond ka kaaran", "Ulte charge ka aakarshan"], ["Taakat", "Bahut majboot"], ["Thos mein bijli", "Nahi (ions fase hue)"], ["Pighle mein bijli", "Haan (ions azaad)"]]
                }
            },
            controls: [
                { id: "scene", label: "🎬 Scene: 0=Atoms, 1=Transfer, 2=Lattice", min: 0, max: 2, step: 1, value: 0, on: function (v, ctx) { ctx.model.setScene(v); } },
                { id: "step", label: "▶️ Transfer progress (scene 1 mein)", min: 0, max: 100, step: 1, value: 0, on: function (v, ctx) { ctx.model.t = v / 100; } },
                { id: "size", label: "🧱 Lattice size (scene 2 mein)", min: 1, max: 4, step: 1, value: 3, on: function (v, ctx) { ctx.model.n = v; ctx.model.buildLattice(); } },
                { id: "explode", label: "💥 Explode lattice (kholo)", min: 0, max: 100, step: 1, value: 0, on: function (v, ctx) { ctx.model.ex = v / 100; } }
            ],
            build: function (ctx) {
                var T = ctx.THREE, P = ctx.pivot, M = ctx.model;
                M.t = 0; M.n = 3; M.ex = 0; M.scene = 0;

                var grid = new T.GridHelper(46, 23, 0x475569, 0x334155); grid.position.y = -11; P.add(grid);

                /* ---------- SCENE 0/1 : atoms + shells + electron ---------- */
                M.atomGrp = new T.Group(); P.add(M.atomGrp);

                function shellRing(r, tilt) {
                    var g = new T.Mesh(new T.TorusGeometry(r, 0.035, 8, 60), ctx.mat(COL.shell, { transparent: true, opacity: 0.5 }));
                    g.rotation.x = Math.PI / 2 + tilt; return g;
                }
                function makeAtom(which) {
                    var g = new T.Group();
                    var isNa = (which === 'na');
                    var core = new T.Mesh(new T.SphereGeometry(isNa ? 1.15 : 1.3, 24, 18), ctx.mat(isNa ? COL.na : COL.cl));
                    ctx.addPart(core, isNa ? 'na' : 'cl'); g.add(core); g.userData.core = core;
                    // shells: Na 2,8,1  Cl 2,8,7
                    var counts = isNa ? [2, 8, 1] : [2, 8, 7];
                    g.userData.els = [];
                    counts.forEach(function (cnt, si) {
                        var r = 2.1 + si * 1.35;
                        g.add(shellRing(r, si * 0.25));
                        for (var i = 0; i < cnt; i++) {
                            var e = new T.Mesh(new T.SphereGeometry(0.2, 10, 8), ctx.mat(COL.e));
                            e.userData.r = r; e.userData.sp = 0.5 + si * 0.22;
                            e.userData.ph = (i / cnt) * Math.PI * 2; e.userData.tilt = si * 0.25;
                            e.userData.outer = (si === counts.length - 1);
                            g.add(e); g.userData.els.push(e);
                        }
                    });
                    return g;
                }
                M.naAtom = makeAtom('na'); M.naAtom.position.set(-8.5, 0, 0); M.atomGrp.add(M.naAtom);
                M.clAtom = makeAtom('cl'); M.clAtom.position.set(8.5, 0, 0); M.atomGrp.add(M.clAtom);

                // the one transferring electron (separate, highlighted)
                M.eMove = new T.Mesh(new T.SphereGeometry(0.30, 14, 12), ctx.mat(COL.e));
                ctx.addPart(M.eMove, 'electron'); M.atomGrp.add(M.eMove);

                // charge labels (simple rings that appear after transfer)
                M.plus = new T.Mesh(new T.TorusGeometry(1.7, 0.09, 8, 40), ctx.mat(0xef4444, { transparent: true, opacity: 0.9 }));
                M.plus.position.set(-8.5, 0, 0); ctx.addPart(M.plus, 'naIon'); M.atomGrp.add(M.plus);
                M.minus = new T.Mesh(new T.TorusGeometry(1.9, 0.09, 8, 40), ctx.mat(0x3b82f6, { transparent: true, opacity: 0.9 }));
                M.minus.position.set(8.5, 0, 0); ctx.addPart(M.minus, 'clIon'); M.atomGrp.add(M.minus);

                /* ---------- SCENE 2 : crystal lattice ---------- */
                M.latGrp = new T.Group(); ctx.addPart(M.latGrp, 'lattice'); P.add(M.latGrp);
                M.bondGrp = new T.Group(); ctx.addPart(M.bondGrp, 'bond'); P.add(M.bondGrp);

                M.buildLattice = function () {
                    while (M.latGrp.children.length) M.latGrp.remove(M.latGrp.children[0]);
                    while (M.bondGrp.children.length) M.bondGrp.remove(M.bondGrp.children[0]);
                    M.ions = [];
                    var n = M.n, sp = 3.0, off = (n - 1) * sp / 2;
                    for (var x = 0; x < n; x++) for (var y = 0; y < n; y++) for (var z = 0; z < n; z++) {
                        var isNa = ((x + y + z) % 2 === 0);
                        var m = new T.Mesh(
                            new T.SphereGeometry(isNa ? 0.72 : 1.12, 18, 14),
                            ctx.mat(isNa ? COL.naIon : COL.clIon));
                        var px = x * sp - off, py = y * sp - off, pz = z * sp - off;
                        m.userData.home = [px, py, pz];
                        m.position.set(px, py, pz);
                        M.latGrp.add(m); M.ions.push(m);
                        // bond sticks to +x and +y and +z neighbours
                        if (x < n - 1) M.bondGrp.add(stick(px, py, pz, px + sp, py, pz));
                        if (y < n - 1) M.bondGrp.add(stick(px, py, pz, px, py + sp, pz));
                        if (z < n - 1) M.bondGrp.add(stick(px, py, pz, px, py, pz + sp));
                    }
                };
                function stick(x1, y1, z1, x2, y2, z2) {
                    var g = new T.Mesh(new T.CylinderGeometry(0.055, 0.055, 1, 6), ctx.mat(0x94a3b8, { transparent: true, opacity: 0.55 }));
                    var dx = x2 - x1, dy = y2 - y1, dz = z2 - z1;
                    var len = Math.sqrt(dx * dx + dy * dy + dz * dz);
                    g.scale.y = len;
                    g.position.set((x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2);
                    if (Math.abs(dx) > 0.01) g.rotation.z = Math.PI / 2;
                    else if (Math.abs(dz) > 0.01) g.rotation.x = Math.PI / 2;
                    g.userData.home = [(x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2];
                    return g;
                }
                M.buildLattice();

                M.setScene = function (v) {
                    M.scene = v;
                    M.atomGrp.visible = (v < 2);
                    M.latGrp.visible = M.bondGrp.visible = (v === 2);
                };
                M.setScene(0);
                P.rotation.x = 0.2;
            },

            onFrame: function (t, ctx) {
                var M = ctx.model; if (!M.naAtom) return;

                if (M.scene < 2) {
                    // orbiting electrons
                    [M.naAtom, M.clAtom].forEach(function (a) {
                        a.userData.els.forEach(function (e) {
                            var ang = e.userData.ph + t * e.userData.sp;
                            var r = e.userData.r;
                            e.position.set(Math.cos(ang) * r, Math.sin(ang) * r * Math.sin(e.userData.tilt + 0.9), Math.sin(ang) * r * Math.cos(e.userData.tilt + 0.9));
                        });
                    });
                    var prog = (M.scene === 1) ? Math.max(0, Math.min(1, M.t)) : 0;

                    // hide Na's outer electron once transfer starts; Cl gains one at the end
                    M.naAtom.userData.els.forEach(function (e) { if (e.userData.outer) e.visible = (prog < 0.02); });

                    // moving electron: from Na outer shell -> Cl outer shell
                    M.eMove.visible = (M.scene === 1);
                    if (M.scene === 1) {
                        var a = [-8.5 + 4.8, 0, 0], b = [8.5 - 4.8, 0, 0];
                        var e2 = prog < 0.5 ? 2 * prog * prog : 1 - Math.pow(-2 * prog + 2, 2) / 2;
                        M.eMove.position.set(a[0] + (b[0] - a[0]) * e2, Math.sin(e2 * Math.PI) * 2.2, 0);
                        // once arrived, park it in Cl's outer shell
                        if (prog > 0.98) {
                            var ang2 = t * 0.94;
                            M.eMove.position.set(8.5 + Math.cos(ang2) * 4.8, Math.sin(ang2) * 4.8 * Math.sin(1.4), Math.sin(ang2) * 4.8 * Math.cos(1.4));
                        }
                    }
                    // charge rings + ion sizes appear after transfer
                    var done = (M.scene === 1 && M.t > 0.95);
                    M.plus.visible = M.minus.visible = done;
                    M.plus.rotation.y = t * 0.6; M.minus.rotation.y = -t * 0.6;
                    // ion size change: Na shrinks, Cl grows
                    var s1 = done ? 0.62 : 1, s2 = done ? 1.16 : 1;
                    M.naAtom.userData.core.scale.setScalar(s1);
                    M.clAtom.userData.core.scale.setScalar(s2);
                    // pull ions together slightly once bonded
                    M.naAtom.position.x = -8.5 + (done ? 1.6 : 0);
                    M.clAtom.position.x = 8.5 - (done ? 1.6 : 0);
                    M.plus.position.x = M.naAtom.position.x;
                    M.minus.position.x = M.clAtom.position.x;
                } else {
                    // lattice explode
                    var k = 1 + M.ex * 1.5;
                    M.ions.forEach(function (m) {
                        var h = m.userData.home;
                        m.position.set(h[0] * k, h[1] * k, h[2] * k);
                    });
                    M.bondGrp.children.forEach(function (b) {
                        var h = b.userData.home;
                        b.position.set(h[0] * k, h[1] * k, h[2] * k);
                        b.visible = (M.ex < 0.25);
                    });
                }
            }
        });
    </script>
</body>

</html>
