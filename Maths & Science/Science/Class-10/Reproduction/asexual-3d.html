<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Asexual Reproduction | AIkiPadhai</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../sci-3d.js"></script>
</head>

<body>
    <script>
        var CYTO = 0x86efac, NUC = 0x15803d, BUD = 0x4ade80, YEAST = 0xfbbf24, WORM = 0xf472b6, ALGAE = 0x22c55e;

        Sci3D({
            title: "🧊 3D Asexual Reproduction",
            back: { href: "asexual.html", label: "Back to Lesson" },
            intro: {
                name: "3D Asexual Lab",
                desc: "Paanch tareeke, ek lab mein! 'Mode' slider se koi bhi chuno — Amoeba ka bat'na, Hydra par kali ugna, Spirogyra ka tootna, Planaria ka dobara ugna, ya Rhizopus ke spores udna. Phir 'Play' slider ghumakar poori prakriya chalte hue dekho."
            },
            camZ: 26,
            data: {
                cell: { emoji: "🟢", name: "Parent Cell / Jeev", nick: "Shuruaat", desc: "Wo ek parent jisse sab shuru hota hai. Asexual reproduction mein sirf EK parent hota hai — isliye santaan uski hubahu copy (clone) hoti hai.", stats: [["Parents", "Sirf 1"], ["Santaan", "Clone (hubahu copy)"], ["Variation", "Bahut kam"]] },
                nucleus: { emoji: "⚫", name: "Nucleus", nick: "DNA ka ghar", desc: "Sabse pehle NUCLEUS bat'ta hai — kyunki DNA ki poori copy dono nayi cells tak pahunchni zaroori hai. Uske baad hi cytoplasm bat'ta hai.", stats: [["Andar", "DNA"], ["Kab bat'ta hai", "Cytoplasm se PEHLE"], ["Kyun", "Dono ko poora DNA mile"]] },
                fission: { emoji: "✂️", name: "Binary Fission", nick: "Amoeba", desc: "Ek cell DO barabar hisson mein bat jaati hai. Amoeba ki koi fixed shape nahi hoti, isliye wo KISI BHI disha se bat sakta hai. (Leishmania hamesha ek khaas disha mein bat'ta hai — board ka favourite point!)", stats: [["Kitne bante", "2 barabar"], ["Udaharan", "Amoeba, Bacteria"], ["Disha", "Koi bhi"], ["Leishmania", "Sirf ek khaas disha"]] },
                budding: { emoji: "🌱", name: "Budding", nick: "Hydra / Yeast", desc: "Parent ke shareer par ek chhoti KALI (bud) ugti hai. Wo wahin poshan leti hai, badhti hai, aur taiyaar hone par TOOTKAR alag ho jaati hai.", stats: [["Kya ugta hai", "Kali (bud)"], ["Kahan", "Parent ke shareer par"], ["Udaharan", "Hydra, Yeast"], ["Ant mein", "Tootkar alag"]] },
                fragment: { emoji: "🧩", name: "Fragmentation", nick: "Spirogyra", desc: "Jeev ka shareer TUKDON mein toot jaata hai, aur har tukda badhkar poora naya jeev ban jaata hai. Ye sirf saral banawat wale jeevon mein hota hai.", stats: [["Kya hota", "Shareer tukdon mein tootta"], ["Har tukda", "Poora jeev banta"], ["Udaharan", "Spirogyra (talab ki kaai)"], ["Shart", "Banawat saral honi chahiye"]] },
                regen: { emoji: "🔄", name: "Regeneration", nick: "Planaria", desc: "Agar jeev KAT jaaye toh har tukda apne khoye hisse dobara bana leta hai. DHYAN DO: ye prajanan ka saamanya tareeka NAHI hai — ye marammat ki kshamata hai. Planaria khud ko kaat kar bachche nahi banata!", stats: [["Kya", "Khoye hisse dobara ugna"], ["Udaharan", "Planaria, Hydra"], ["⚠️ Yaad rakho", "Reproduction NAHI, marammat hai"], ["Chhipkali ki poonch", "Bhi regeneration"]] },
                spore: { emoji: "💨", name: "Spore Formation", nick: "Rhizopus", desc: "Upar chhoti kaali goliyan (sporangia) banti hain jinme HAZARON spores bhare hote hain. Wo phatti hain aur spores hawa mein ud jaate hain. Har spore par mota cover hota hai jo use saalon tak zinda rakhta hai.", stats: [["Kitne bante", "Hazaron"], ["Failte hain", "Hawa se"], ["Cover", "Mota aur sakht"], ["Udaharan", "Rhizopus (roti ki phaphoondi)"]] }
            },
            controls: [
                { id: "mode", label: "🔬 Mode: 0=Fission 1=Budding 2=Fragment 3=Regen 4=Spore", min: 0, max: 4, step: 1, value: 0, on: function (v, ctx) { ctx.model.setMode(v); } },
                { id: "play", label: "▶️ Prakriya chalao (0 → 100)", min: 0, max: 100, step: 1, value: 0, on: function (v, ctx) { ctx.model.p = v / 100; } },
                { id: "auto", label: "🔁 Auto-play (0=off, 1=on)", min: 0, max: 1, step: 1, value: 0, on: function (v, ctx) { ctx.model.auto = (v === 1); } }
            ],

            build: function (ctx) {
                var T = ctx.THREE, P = ctx.pivot, M = ctx.model;
                M.p = 0; M.auto = false; M.mode = 0;

                var rim = new T.DirectionalLight(0xbbf7d0, 0.5); rim.position.set(-7, 5, -6); ctx.scene.add(rim);
                function cellMat(hex, o) { var m = ctx.mat(hex, o); m.shininess = 26; return m; }
                function blob(r, seg, amt, hex, o) {
                    var g = new T.SphereGeometry(r, seg, Math.round(seg * 0.7));
                    var pos = g.attributes.position;
                    for (var i = 0; i < pos.count; i++) {
                        var x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
                        var n = Math.sin(x * 1.9 + y * 1.4) * Math.cos(z * 1.7 - y);
                        var d = 1 + n * amt;
                        pos.setXYZ(i, x * d, y * d, z * d);
                    }
                    pos.needsUpdate = true; g.computeVertexNormals();
                    return new T.Mesh(g, cellMat(hex, o));
                }

                var grid = new T.GridHelper(40, 20, 0x475569, 0x334155); grid.position.y = -9; P.add(grid);

                /* ========== 0. BINARY FISSION (Amoeba) ========== */
                M.g0 = new T.Group(); P.add(M.g0);
                M.amo = [blob(3.0, 40, 0.13, CYTO, { transparent: true, opacity: 0.92 }),
                         blob(3.0, 40, 0.13, CYTO, { transparent: true, opacity: 0.92 })];
                M.amo.forEach(function (a) { ctx.addPart(a, 'fission'); M.g0.add(a); });
                M.amoNuc = [blob(0.85, 20, 0.1, NUC), blob(0.85, 20, 0.1, NUC)];
                M.amoNuc.forEach(function (n) { ctx.addPart(n, 'nucleus'); M.g0.add(n); });
                // pseudopodia
                M.pseudo = [];
                for (var q = 0; q < 5; q++) {
                    var ps = blob(0.75, 14, 0.2, CYTO, { transparent: true, opacity: 0.9 });
                    ctx.addPart(ps, 'cell'); M.g0.add(ps); M.pseudo.push(ps);
                }

                /* ========== 1. BUDDING (Hydra) ========== */
                M.g1 = new T.Group(); P.add(M.g1);
                var body = new T.Mesh(new T.CylinderGeometry(1.0, 1.35, 7.5, 22), cellMat(BUD));
                ctx.addPart(body, 'cell'); M.g1.add(body);
                // tentacles on the parent
                for (var t1 = 0; t1 < 6; t1++) {
                    var a1 = (t1 / 6) * Math.PI * 2;
                    var c1 = new T.CatmullRomCurve3([
                        new T.Vector3(0, 3.7, 0),
                        new T.Vector3(Math.cos(a1) * 1.4, 4.6, Math.sin(a1) * 1.4),
                        new T.Vector3(Math.cos(a1) * 2.6, 5.2, Math.sin(a1) * 2.6)]);
                    var tm = new T.Mesh(new T.TubeGeometry(c1, 16, 0.14, 7, false), cellMat(BUD));
                    ctx.addPart(tm, 'cell'); M.g1.add(tm);
                }
                M.bud = new T.Mesh(new T.CylinderGeometry(0.5, 0.7, 3.2, 18), cellMat(0x86efac));
                ctx.addPart(M.bud, 'budding'); M.g1.add(M.bud);
                M.budTent = new T.Group(); ctx.addPart(M.budTent, 'budding'); M.g1.add(M.budTent);
                for (var t2 = 0; t2 < 5; t2++) {
                    var a2 = (t2 / 5) * Math.PI * 2;
                    var tb = new T.Mesh(new T.CylinderGeometry(0.07, 0.07, 1.3, 6), cellMat(0x86efac));
                    tb.position.set(Math.cos(a2) * 0.55, 0.65, Math.sin(a2) * 0.55);
                    tb.rotation.z = -Math.cos(a2) * 0.6; tb.rotation.x = Math.sin(a2) * 0.6;
                    M.budTent.add(tb);
                }

                /* ========== 2. FRAGMENTATION (Spirogyra) ========== */
                M.g2 = new T.Group(); P.add(M.g2);
                M.frags = [];
                for (var f = 0; f < 9; f++) {
                    var seg = new T.Mesh(new T.CylinderGeometry(0.85, 0.85, 1.9, 18), cellMat(ALGAE));
                    seg.rotation.z = Math.PI / 2;
                    seg.userData.home = -8 + f * 2.0;
                    seg.userData.i = f;
                    ctx.addPart(seg, 'fragment'); M.g2.add(seg); M.frags.push(seg);
                    // spiral chloroplast band (Spirogyra's signature)
                    var sc = [];
                    for (var s2 = 0; s2 <= 20; s2++) {
                        var u = s2 / 20;
                        sc.push(new T.Vector3(-0.9 + u * 1.8, Math.cos(u * 7) * 0.75, Math.sin(u * 7) * 0.75));
                    }
                    var band = new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(sc), 24, 0.11, 6, false), cellMat(0x15803d));
                    band.userData.parent = seg;
                    seg.add(band); band.rotation.z = -Math.PI / 2;
                }

                /* ========== 3. REGENERATION (Planaria) ========== */
                M.g3 = new T.Group(); P.add(M.g3);
                M.planaria = [];
                [[-4.5, 1], [4.5, -1]].forEach(function (cfg, idx) {
                    var g = new T.Group();
                    var bodyP = new T.Mesh(new T.CylinderGeometry(0.9, 0.55, 7, 20), cellMat(WORM));
                    bodyP.rotation.z = Math.PI / 2; g.add(bodyP);
                    var head = blob(1.05, 18, 0.12, WORM);
                    head.position.x = cfg[1] * 3.6; head.scale.set(1, 0.7, 1.2); g.add(head);
                    // eyespots
                    [-0.4, 0.4].forEach(function (dz) {
                        var e = new T.Mesh(new T.SphereGeometry(0.15, 8, 6), cellMat(0x1e293b));
                        e.position.set(cfg[1] * 4.0, 0.4, dz); g.add(e);
                    });
                    g.userData.home = cfg[0]; g.userData.dir = cfg[1];
                    ctx.addPart(g, 'regen'); M.g3.add(g); M.planaria.push(g);
                });
                M.cutLine = new T.Mesh(new T.BoxGeometry(0.16, 3, 3), cellMat(0xef4444, { transparent: true, opacity: 0.75 }));
                M.g3.add(M.cutLine);

                /* ========== 4. SPORE FORMATION (Rhizopus) ========== */
                M.g4 = new T.Group(); P.add(M.g4);
                M.sporangia = []; M.spores = [];
                for (var h = 0; h < 3; h++) {
                    var hx = (h - 1) * 5.2;
                    var stalk = new T.Mesh(new T.CylinderGeometry(0.13, 0.18, 6.5, 12), cellMat(0xe2e8f0));
                    stalk.position.set(hx, -2.2, 0);
                    ctx.addPart(stalk, 'cell'); M.g4.add(stalk);
                    var cap = blob(1.15, 22, 0.08, 0x374151);
                    cap.position.set(hx, 1.5, 0);
                    ctx.addPart(cap, 'spore'); M.g4.add(cap); M.sporangia.push(cap);
                    for (var sp = 0; sp < 14; sp++) {
                        var s3 = new T.Mesh(new T.SphereGeometry(0.15, 8, 6), cellMat(0x6b7280));
                        s3.userData.base = [hx, 1.5, 0];
                        s3.userData.dir = [(Math.random() - .5) * 2, Math.random() * 1.4 + .3, (Math.random() - .5) * 2];
                        s3.userData.sp = 0.6 + Math.random() * 0.8;
                        ctx.addPart(s3, 'spore'); M.g4.add(s3); M.spores.push(s3);
                    }
                }
                // hyphae mat along the ground
                for (var hy = 0; hy < 10; hy++) {
                    var c3 = new T.CatmullRomCurve3([
                        new T.Vector3(-9 + hy * 2, -5.4, -2 + Math.random() * 4),
                        new T.Vector3(-7 + hy * 2, -5.4, -1 + Math.random() * 3),
                        new T.Vector3(-5 + hy * 2, -5.4, -2 + Math.random() * 4)]);
                    var hm = new T.Mesh(new T.TubeGeometry(c3, 14, 0.07, 5, false), cellMat(0xf1f5f9));
                    ctx.addPart(hm, 'cell'); M.g4.add(hm);
                }

                M.groups = [M.g0, M.g1, M.g2, M.g3, M.g4];
                M.setMode = function (v) {
                    M.mode = v;
                    M.groups.forEach(function (g, i) { g.visible = (i === v); });
                };
                M.setMode(0);
                P.rotation.x = 0.12;
            },

            onFrame: function (t, ctx) {
                var M = ctx.model; if (!M.groups) return;
                if (M.auto) { M.p += 0.005; if (M.p > 1.25) M.p = 0; }
                var p = Math.max(0, Math.min(1, M.p));

                if (M.mode === 0) {
                    /* fission: nucleus divides FIRST, then cytoplasm pinches apart */
                    var nucSplit = Math.min(1, p / 0.45);
                    var cytoSplit = Math.max(0, (p - 0.4) / 0.6);
                    M.amoNuc[0].position.x = -nucSplit * 2.6;
                    M.amoNuc[1].position.x = nucSplit * 2.6;
                    M.amo[0].position.x = -cytoSplit * 3.6;
                    M.amo[1].position.x = cytoSplit * 3.6;
                    var squeeze = 1 - Math.sin(Math.min(1, p) * Math.PI) * 0.18;
                    M.amo.forEach(function (a) { a.scale.set(squeeze, 1, 1); });
                    M.pseudo.forEach(function (ps, i) {
                        var a = t * 0.5 + i * 1.3;
                        var side = i < 3 ? -1 : 1;
                        var host = side < 0 ? M.amo[0] : M.amo[1];
                        ps.position.set(host.position.x + Math.cos(a) * 3.1, Math.sin(a * 1.3) * 2.4, Math.sin(a) * 2.2);
                        ps.scale.setScalar(0.8 + Math.sin(t * 2 + i) * 0.18);
                    });
                }
                else if (M.mode === 1) {
                    /* budding: bud grows, gets tentacles, then detaches */
                    var grow = Math.min(1, p / 0.6);
                    var detach = Math.max(0, (p - 0.62) / 0.38);
                    M.bud.scale.setScalar(0.25 + grow * 0.85);
                    M.bud.position.set(1.45 + detach * 4.5, -0.6 - detach * 2.2, 0);
                    M.budTent.visible = grow > 0.55;
                    M.budTent.position.copy(M.bud.position);
                    M.budTent.position.y += 1.5 * (0.25 + grow * 0.85);
                    M.budTent.scale.setScalar(0.25 + grow * 0.85);
                }
                else if (M.mode === 2) {
                    /* fragmentation: filament breaks into pieces that drift apart */
                    M.frags.forEach(function (s) {
                        var i = s.userData.i;
                        var brk = Math.max(0, (p - 0.25) / 0.75);
                        var away = (i - 4) * brk * 1.6;
                        s.position.x = s.userData.home + away;
                        s.position.y = Math.sin(i * 1.7) * brk * 2.2;
                        s.position.z = Math.cos(i * 2.1) * brk * 1.6;
                        s.rotation.x = brk * (i % 2 ? 1 : -1) * 1.2;
                    });
                }
                else if (M.mode === 3) {
                    /* regeneration: one worm is cut, both halves regrow */
                    var cut = Math.min(1, p / 0.3);
                    var regrow = Math.max(0, (p - 0.35) / 0.65);
                    M.cutLine.visible = p > 0.05 && p < 0.5;
                    M.cutLine.scale.set(1, 1 - regrow, 1 - regrow);
                    M.planaria.forEach(function (g) {
                        g.position.x = g.userData.home * (0.25 + cut * 0.75 + regrow * 0.35);
                        g.scale.setScalar(0.55 + regrow * 0.45);
                        g.position.y = Math.sin(t * 1.2 + g.userData.dir) * 0.25;
                        g.rotation.z = Math.sin(t * 0.9 + g.userData.dir) * 0.08;
                    });
                }
                else if (M.mode === 4) {
                    /* spores: sporangia burst and spores drift away on the air */
                    var burst = Math.max(0, (p - 0.3) / 0.7);
                    M.sporangia.forEach(function (c) { c.scale.setScalar(1 + burst * 0.35); c.material.opacity = 1; });
                    M.spores.forEach(function (s, i) {
                        var b = s.userData.base, d = s.userData.dir;
                        var k = burst * s.userData.sp;
                        s.position.set(b[0] + d[0] * k * 7 + Math.sin(t + i) * k * 0.8,
                            b[1] + d[1] * k * 6,
                            b[2] + d[2] * k * 7 + Math.cos(t * 0.8 + i) * k * 0.8);
                        s.visible = burst > 0.02;
                    });
                }
            }
        });
    </script>
</body>

</html>
