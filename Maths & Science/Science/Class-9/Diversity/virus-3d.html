<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Virus (Bacteriophage) | AIkiPadhai</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../sci-3d.js"></script>
</head>

<body>
    <script>
        Sci3D({
            title: "🦠 3D Virus (Bacteriophage)",
            back: { href: "nomenclature-viruses.html", label: "Back to Lesson" },
            intro: {
                name: "3D Bacteriophage",
                desc: "Ye virus bacteria ko shikaar banata hai — dekhne mein chandrayaan ke lander jaisa! 'Attack' slider ghumao aur dekho: taangein bacteria par tikti hain, tail sikudti hai, aur DNA andar INJECT ho jaata hai. Kisi bhi part par tap karo."
            },
            camZ: 20,
            data: {
                head: { emoji: "🔷", name: "Head (Capsid)", nick: "Protein ka dibba", desc: "Protein ka bahri cover jo andar DNA ko bachata hai. Iski shape ICOSAHEDRAL (20 tikoni satah wali) hoti hai — ye shape sabse kam protein mein sabse zyada jagah deti hai, isliye prakriti ne ise chuna!", stats: [["Bana", "Protein"], ["Shape", "Icosahedral (20 faces)"], ["Andar", "DNA"], ["Kaam", "DNA ki suraksha"]] },
                dna: { emoji: "🧬", name: "Genetic Material (DNA)", nick: "Nirdesh (blueprint)", desc: "Head ke andar kundli maara hua DNA. Virus ke paas khud kuch nahi hota — wo ye DNA bacteria mein daal deta hai, aur bacteria ki hi machinery se naye virus ban jaate hain!", stats: [["Kya", "DNA (kuch mein RNA)"], ["Kahan", "Head ke andar"], ["Kaam", "Naye virus banwana"], ["Khud se", "Kuch nahi kar sakta"]] },
                sheath: { emoji: "🧴", name: "Tail Sheath", nick: "Injection ki soi", desc: "Lambi naali. Jab virus bacteria par tikta hai, ye sheath SIKUD jaati hai (jaise spring dabti hai) aur andar ki naali bacteria ki deewar ko CHHED kar DNA andar pahuncha deti hai.", stats: [["Kaam", "DNA inject karna"], ["Attack par", "Sikud jaati hai"], ["Tulna", "Injection ki soi"]] },
                collar: { emoji: "⭕", name: "Collar", nick: "Head-tail jod", desc: "Head aur tail ke beech ka chhota jod. Yahin se DNA head se nikal kar tail mein jaata hai.", stats: [["Kahan", "Head aur tail ke beech"], ["Kaam", "DNA ka raasta"]] },
                baseplate: { emoji: "🛑", name: "Base Plate", nick: "Landing platform", desc: "Tail ke sabse neeche ki chapti plate. Ye bacteria ki satah ko pehchaanti hai aur usi par tikti hai — bilkul chandrayaan ke lander ki tarah!", stats: [["Shape", "Chapti plate"], ["Kaam", "Bacteria par tikna"], ["Pehchaanti hai", "Sahi bacteria"]] },
                fibers: { emoji: "🦿", name: "Tail Fibres", nick: "Taangein", desc: "Patli mudi hui 'taangein' jo bacteria ki satah ko pakadti hain. Ye har bacteria par nahi tikti — sirf SAHI wale par. Isiliye har virus har jeev ko bimar nahi kar sakta!", stats: [["Kitni", "6"], ["Kaam", "Bacteria pakadna"], ["Khaas", "Sirf sahi host par tikti hain"]] },
                bacteria: { emoji: "🟢", name: "Bacteria (host)", nick: "Shikaar", desc: "Virus ka nishana. Virus iski deewar mein chhed karke DNA daal deta hai. Kuch hi der mein bacteria ke andar sainkdon naye virus ban jaate hain aur wo PHAT jaata hai.", stats: [["Role", "Host (shikaar)"], ["Baad mein", "Phat jaata hai"], ["Naye virus", "Sainkdon"]] }
            },
            controls: [
                { id: "atk", label: "🎯 Attack (tikna → sikudna → inject)", min: 0, max: 100, step: 1, value: 0, on: function (v, ctx) { ctx.model.atk = v / 100; } },
                { id: "cut", label: "✂️ Head kaat kar DNA dekho", min: 0, max: 1, step: 1, value: 0, on: function (v, ctx) { ctx.model.cut = (v === 1); } }
            ],

            build: function (ctx) {
                var T = ctx.THREE, P = ctx.pivot, M = ctx.model;
                M.atk = 0; M.cut = false;

                var rim = new T.DirectionalLight(0x93c5fd, 0.5); rim.position.set(-7, 4, -6); ctx.scene.add(rim);
                function mat(hex, o) { var m = ctx.mat(hex, o); m.shininess = 40; return m; }

                M.phage = new T.Group(); P.add(M.phage);

                /* ---------- HEAD: icosahedral capsid + faceted edges ---------- */
                M.head = new T.Mesh(new T.IcosahedronGeometry(2.5, 0), mat(0x38bdf8, { transparent: true, opacity: 1 }));
                M.head.position.y = 5.6;
                ctx.addPart(M.head, 'head'); M.phage.add(M.head);
                // edge struts to make the icosahedron read clearly
                var eg = new T.EdgesGeometry(new T.IcosahedronGeometry(2.52, 0));
                M.headEdges = new T.LineSegments(eg, new T.LineBasicMaterial({ color: 0x0ea5e9 }));
                M.headEdges.position.y = 5.6; M.phage.add(M.headEdges);

                /* ---------- DNA: coiled tube inside the head ---------- */
                var dnaPts = [];
                for (var i = 0; i <= 60; i++) {
                    var a = i * 0.55, r = 1.5 - i * 0.012;
                    dnaPts.push(new T.Vector3(Math.cos(a) * r, (i / 60 - 0.5) * 2.6, Math.sin(a) * r));
                }
                M.dna = new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(dnaPts), 90, 0.13, 7, false), mat(0xfacc15));
                M.dna.position.y = 5.6;
                ctx.addPart(M.dna, 'dna'); M.phage.add(M.dna);

                /* ---------- COLLAR ---------- */
                var collar = new T.Mesh(new T.CylinderGeometry(0.62, 0.75, 0.42, 16), mat(0x0284c7));
                collar.position.y = 3.0;
                ctx.addPart(collar, 'collar'); M.phage.add(collar);

                /* ---------- TAIL SHEATH: stacked rings (so contraction is visible) ---------- */
                M.sheathG = new T.Group(); ctx.addPart(M.sheathG, 'sheath'); M.phage.add(M.sheathG);
                M.rings = [];
                for (var r2 = 0; r2 < 9; r2++) {
                    var ring = new T.Mesh(new T.TorusGeometry(0.44, 0.15, 8, 18), mat(0x0369a1));
                    ring.rotation.x = Math.PI / 2;
                    ring.userData.i = r2;
                    M.sheathG.add(ring); M.rings.push(ring);
                }
                // inner tube (the actual needle)
                M.core = new T.Mesh(new T.CylinderGeometry(0.16, 0.16, 3.0, 12), mat(0x7dd3fc));
                M.sheathG.add(M.core);

                /* ---------- BASE PLATE ---------- */
                M.base = new T.Group();
                var plate = new T.Mesh(new T.CylinderGeometry(1.05, 0.85, 0.26, 6), mat(0x0c4a6e));
                M.base.add(plate);
                for (var s = 0; s < 6; s++) {          // spikes under the plate
                    var sa = (s / 6) * Math.PI * 2;
                    var sp = new T.Mesh(new T.ConeGeometry(0.09, 0.5, 6), mat(0x075985));
                    sp.position.set(Math.cos(sa) * 0.6, -0.3, Math.sin(sa) * 0.6);
                    sp.rotation.x = Math.PI; M.base.add(sp);
                }
                M.base.position.y = -0.4;
                ctx.addPart(M.base, 'baseplate'); M.phage.add(M.base);

                /* ---------- TAIL FIBRES: 6 bent legs (tubes) ---------- */
                M.legG = new T.Group(); ctx.addPart(M.legG, 'fibers'); M.phage.add(M.legG);
                M.legs = [];
                for (var L = 0; L < 6; L++) {
                    var la = (L / 6) * Math.PI * 2 + 0.3;
                    var g = new T.Group();
                    var upper = new T.Mesh(new T.CylinderGeometry(0.075, 0.075, 1.5, 7), mat(0x0ea5e9));
                    upper.position.y = -0.75; g.add(upper);
                    var knee = new T.Mesh(new T.SphereGeometry(0.12, 8, 6), mat(0x38bdf8));
                    knee.position.y = -1.5; g.add(knee);
                    var lower = new T.Group();
                    var low = new T.Mesh(new T.CylinderGeometry(0.06, 0.06, 1.6, 7), mat(0x0ea5e9));
                    low.position.y = -0.8; lower.add(low);
                    lower.position.y = -1.5; g.add(lower);
                    g.userData.lower = lower;
                    g.position.set(Math.cos(la) * 0.85, -0.55, Math.sin(la) * 0.85);
                    g.rotation.z = -Math.cos(la) * 0.35; g.rotation.x = Math.sin(la) * 0.35;
                    M.legG.add(g); M.legs.push(g);
                }

                /* ---------- HOST BACTERIA ---------- */
                M.bact = new T.Group();
                var body = new T.Mesh(new T.CylinderGeometry(3.2, 3.2, 7, 26), mat(0x22c55e, { transparent: true, opacity: 0.9 }));
                body.rotation.z = Math.PI / 2; M.bact.add(body);
                [-3.5, 3.5].forEach(function (x) {
                    var cap = new T.Mesh(new T.SphereGeometry(3.2, 22, 16), mat(0x22c55e, { transparent: true, opacity: 0.9 }));
                    cap.position.x = x; M.bact.add(cap);
                });
                M.bact.position.y = -7.2;
                ctx.addPart(M.bact, 'bacteria'); P.add(M.bact);

                // injected DNA inside the bacterium (appears at the end)
                M.injected = new T.Mesh(new T.TorusKnotGeometry(0.9, 0.11, 70, 8), mat(0xfacc15));
                M.injected.position.set(0, -7.2, 0); M.injected.visible = false;
                P.add(M.injected);

                P.rotation.x = 0.1;
            },

            onFrame: function (t, ctx) {
                var M = ctx.model; if (!M.phage) return;
                var a = M.atk;

                // phase 1 (0-0.4): descend and legs splay onto the bacterium
                var descend = Math.min(1, a / 0.4);
                M.phage.position.y = -descend * 2.6;
                M.legs.forEach(function (g, i) {
                    g.userData.lower.rotation.x = descend * 1.15;
                    g.rotation.y = Math.sin(t * 2 + i) * 0.04 * (1 - descend);
                });

                // phase 2 (0.4-0.75): sheath CONTRACTS (rings bunch up)
                var contract = Math.max(0, Math.min(1, (a - 0.4) / 0.35));
                M.rings.forEach(function (r) {
                    var i = r.userData.i;
                    var spread = 0.34 * (1 - contract * 0.55);
                    r.position.y = 2.6 - i * spread;
                    r.scale.setScalar(1 + contract * 0.42);       // rings fatten as they compress
                });
                M.core.position.y = 1.5 - contract * 1.35;
                M.core.scale.y = 1 + contract * 0.5;

                // phase 3 (0.75-1): DNA drains from head into the bacterium
                var inject = Math.max(0, Math.min(1, (a - 0.75) / 0.25));
                M.dna.scale.setScalar(1 - inject * 0.85);
                M.injected.visible = inject > 0.15;
                M.injected.scale.setScalar(0.3 + inject * 1.0);
                M.injected.rotation.y = t * 0.8;
                M.injected.rotation.x = t * 0.5;

                // cut-away head
                M.head.material.opacity = M.cut ? 0.22 : 1;
                M.head.material.transparent = M.cut;
                M.headEdges.visible = true;

                if (a < 0.02) M.phage.rotation.y = Math.sin(t * 0.4) * 0.12;   // idle drift
            }
        });
    </script>
</body>

</html>
