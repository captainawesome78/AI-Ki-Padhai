<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Neuron | AIkiPadhai</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../sci-3d.js"></script>
</head>

<body>
    <script>
        Sci3D({
            title: "🧠 3D Neuron",
            back: { href: "muscular-and-nervous.html", label: "Back to Lesson" },
            intro: {
                name: "3D Neuron",
                desc: "Asli shakal ka neuron — shareer ki sabse lambi cell! Dendrites ki shakhaein, myelin ki gaanth-gaanth parat, aur beech ke NODES dekho. 'Signal' slider se sandesh ko axon par daudte hue dekho. Drag karke ghumao, kisi bhi part par tap karo."
            },
            camZ: 26,
            data: {
                soma: { emoji: "⚪", name: "Cell Body (Soma)", nick: "Control centre", desc: "Neuron ka mukhya hissa jisme NUCLEUS hota hai. Yahin se poori cell control hoti hai aur yahin energy banti hai. Dendrites se aaye saare signals yahan ikatthe hote hain.", stats: [["Andar", "Nucleus + cytoplasm"], ["Kaam", "Cell ka control"], ["Signal", "Yahan ikattha hota hai"]] },
                dendrites: { emoji: "🌿", name: "Dendrites", nick: "Sandesh LENE wale", desc: "Ped ki shakhaon jaise phaile hue hisse. Ye doosre neurons se sandesh RECEIVE karte hain aur soma tak pahunchate hain. Jitni zyada shakhaein, utne zyada connections!", stats: [["Disha", "Signal ANDAR laate hain"], ["Shakal", "Ped ki shakhaon jaisi"], ["Kaam", "Sandesh lena"]] },
                axon: { emoji: "🔌", name: "Axon", nick: "Lamba taar",  desc: "Sandesh ko soma se DOOR le jaane wala lamba taar. Manushya ka sabse lamba axon kamar se pair ke angoothe tak — lagbhag 1 METRE lamba ek hi cell!", stats: [["Disha", "Signal BAHAR le jaata hai"], ["Sabse lamba", "~1 metre (insaan mein)"], ["Kitne", "Har neuron mein sirf 1"]] },
                myelin: { emoji: "🛡️", name: "Myelin Sheath", nick: "Speed booster",  desc: "Axon par chadhi chikni CHARBI ki parat — bilkul bijli ke taar par lagi insulation ki tarah. Ye signal ki raftaar ko 100 GUNA tak tez kar deti hai!", stats: [["Bana", "Charbi (fat)"], ["Kaam", "Insulation + speed"], ["Speed", "100x tak tez"], ["Bimari", "Iske kharab hone se MS"]] },
                node: { emoji: "⚡", name: "Node of Ranvier", nick: "Chhalaang ki jagah", desc: "Myelin ke beech ke KHAALI gaps. Signal in gaps par CHHALAANG (jump) lagata hua chalta hai — poore axon par rengne ke bajaye. Isiliye itni raftaar milti hai! Ise 'saltatory conduction' kehte hain.", stats: [["Kya hai", "Myelin ke beech gap"], ["Kaam", "Signal chhalaang lagata hai"], ["Naam", "Saltatory conduction"], ["Faayda", "Bahut tez + kam energy"]] },
                terminals: { emoji: "🔚", name: "Axon Terminals", nick: "Sandesh DENE wale", desc: "Axon ke aakhir mein nikli chhoti shakhaein, jinke sire par gol GAANTH (bouton) hoti hain. Yahin se agle neuron ya maanspeshi ko sandesh diya jaata hai.", stats: [["Disha", "Signal BAHAR dete hain"], ["Sire par", "Gol bouton"], ["Aage", "Agla neuron ya muscle"]] },
                synapse: { emoji: "✨", name: "Synapse", nick: "Do neuron ka pul", desc: "Do neurons ke beech ki BAHUT chhoti khaali jagah. Signal yahan bijli se RASAYAN (neurotransmitter) mein badal jaata hai, gap paar karta hai, phir dobara bijli ban jaata hai.", stats: [["Kya hai", "Do neuron ke beech gap"], ["Signal", "Rasayan (chemical) banta hai"], ["Rasayan", "Neurotransmitter"]] }
            },
            controls: [
                { id: "sig", label: "⚡ Signal bhejo (axon par daudta hua)", min: 0, max: 1, step: 1, value: 1, on: function (v, ctx) { ctx.model.sig = (v === 1); } },
                { id: "mye", label: "🛡️ Myelin dikhao (0 = hata do)", min: 0, max: 1, step: 1, value: 1, on: function (v, ctx) { ctx.model.mye = (v === 1); } },
                { id: "speed", label: "🏃 Signal ki raftaar", min: 1, max: 10, step: 1, value: 5, on: function (v, ctx) { ctx.model.spd = v / 5; } }
            ],

            build: function (ctx) {
                var T = ctx.THREE, P = ctx.pivot, M = ctx.model;
                M.sig = true; M.mye = true; M.spd = 1;

                var rim = new T.DirectionalLight(0xc4b5fd, 0.5); rim.position.set(-8, 5, -6); ctx.scene.add(rim);
                function cell(hex, o) { var m = ctx.mat(hex, o); m.shininess = 22; return m; }

                function tube(pts, r, hex, seg) {
                    var c = new T.CatmullRomCurve3(pts.map(function (p) { return new T.Vector3(p[0], p[1], p[2]); }));
                    return { mesh: new T.Mesh(new T.TubeGeometry(c, seg || 24, r, 8, false), cell(hex)), curve: c };
                }
                function roughen(geo, amt) {
                    var pos = geo.attributes.position;
                    for (var i = 0; i < pos.count; i++) {
                        var x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
                        var n = Math.sin(x * 3.1 + y * 2.3) * Math.cos(z * 2.7);
                        pos.setXYZ(i, x + n * amt, y + n * amt, z + n * amt);
                    }
                    pos.needsUpdate = true; geo.computeVertexNormals(); return geo;
                }

                var SX = -11;   // soma centre x

                /* ---------- SOMA: irregular blob + nucleus ---------- */
                var somaG = new T.Group();
                var soma = new T.Mesh(roughen(new T.SphereGeometry(2.1, 30, 24), 0.16), cell(0xa855f7));
                soma.scale.set(1.15, 1, 1);
                somaG.add(soma);
                var nuc = new T.Mesh(roughen(new T.SphereGeometry(0.85, 20, 16), 0.05), cell(0x6b21a8));
                nuc.position.set(-0.15, 0.1, 0.2); somaG.add(nuc);
                var nucleolus = new T.Mesh(new T.SphereGeometry(0.3, 12, 10), cell(0x4c1d95));
                nucleolus.position.set(-0.1, 0.15, 0.55); somaG.add(nucleolus);
                somaG.position.set(SX, 0, 0);
                ctx.addPart(somaG, 'soma'); P.add(somaG);

                /* ---------- DENDRITES: branching trees ---------- */
                var dG = new T.Group(); ctx.addPart(dG, 'dendrites'); P.add(dG);
                var dirs = [[-1, 0.75, 0.3], [-1, -0.15, -0.6], [-0.85, -0.95, 0.35], [-0.7, 1.15, -0.5], [-1, 0.15, 0.75]];
                dirs.forEach(function (d, di) {
                    var L = 4.6 + (di % 2) * 1.1;
                    var ex = SX + d[0] * L, ey = d[1] * L, ez = d[2] * L;
                    // main trunk, slightly wavy
                    var trunk = tube([[SX + d[0] * 1.6, d[1] * 1.6, d[2] * 1.6],
                    [SX + d[0] * L * 0.55 + 0.25, d[1] * L * 0.55, d[2] * L * 0.55],
                    [ex, ey, ez]], 0.2, 0xc084fc, 20);
                    dG.add(trunk.mesh);
                    // two child branches per dendrite
                    [[0.55, 0.8], [0.6, -0.75]].forEach(function (br) {
                        var bx = ex + d[0] * 1.9, by = ey + br[1] * 1.7, bz = ez + br[0] * 1.1 * (di % 2 ? 1 : -1);
                        var b = tube([[ex, ey, ez], [(ex + bx) / 2, (ey + by) / 2 + 0.2, (ez + bz) / 2], [bx, by, bz]], 0.11, 0xd8b4fe, 14);
                        dG.add(b.mesh);
                        // tiny twigs
                        var t2 = tube([[bx, by, bz], [bx + d[0] * 1.2, by + br[1] * 0.8, bz + 0.4]], 0.06, 0xe9d5ff, 8);
                        dG.add(t2.mesh);
                    });
                });

                /* ---------- AXON: long gently-waving tube ---------- */
                var axPts = [];
                for (var a = 0; a <= 10; a++) {
                    var x = SX + 2.0 + a * 2.05;
                    axPts.push([x, Math.sin(a * 0.55) * 0.28, Math.cos(a * 0.4) * 0.22]);
                }
                M.axPts = axPts;
                var axon = tube(axPts, 0.24, 0xc4b5fd, 90);
                M.axonCurve = axon.curve;
                ctx.addPart(axon.mesh, 'axon'); P.add(axon.mesh);

                // axon hillock (thicker where it leaves the soma)
                var hill = new T.Mesh(new T.ConeGeometry(0.55, 1.1, 16), cell(0xb794f6));
                hill.position.set(SX + 1.9, 0, 0); hill.rotation.z = -Math.PI / 2;
                ctx.addPart(hill, 'axon'); P.add(hill);

                /* ---------- MYELIN: fat segments with NODES between ---------- */
                M.myG = new T.Group(); ctx.addPart(M.myG, 'myelin'); P.add(M.myG);
                M.nodeG = new T.Group(); ctx.addPart(M.nodeG, 'node'); P.add(M.nodeG);
                M.nodeXs = [];
                var segCount = 6;
                for (var s = 0; s < segCount; s++) {
                    var u0 = 0.08 + s * 0.145, u1 = u0 + 0.105;
                    var p0 = M.axonCurve.getPoint(u0), p1 = M.axonCurve.getPoint(u1);
                    var mid = p0.clone().lerp(p1, 0.5);
                    var len = p0.distanceTo(p1);
                    // sausage-shaped myelin: lathe profile bulging in the middle
                    var prof = [[0.02, -len / 2], [0.5, -len / 2 + 0.15], [0.62, 0], [0.5, len / 2 - 0.15], [0.02, len / 2]];
                    var seg = new T.Mesh(new T.LatheGeometry(prof.map(function (p) { return new T.Vector2(p[0], p[1]); }), 18), cell(0xfcd34d));
                    seg.position.copy(mid); seg.rotation.z = Math.PI / 2;
                    M.myG.add(seg);
                    // node of Ranvier marker (the gap) — small pinch ring
                    if (s < segCount - 1) {
                        var np = M.axonCurve.getPoint(u1 + 0.02);
                        var ring = new T.Mesh(new T.TorusGeometry(0.28, 0.07, 8, 16), cell(0xf59e0b));
                        ring.position.copy(np); ring.rotation.y = Math.PI / 2;
                        M.nodeG.add(ring);
                        M.nodeXs.push(u1 + 0.02);
                    }
                }

                /* ---------- TERMINALS: branching with boutons ---------- */
                var tG = new T.Group(); ctx.addPart(tG, 'terminals'); P.add(tG);
                var endP = M.axonCurve.getPoint(1);
                M.boutons = [];
                for (var b2 = 0; b2 < 5; b2++) {
                    var ang = (b2 / 5) * Math.PI * 2;
                    var bx2 = endP.x + 2.3, by2 = endP.y + Math.cos(ang) * 1.9, bz2 = endP.z + Math.sin(ang) * 1.5;
                    var br2 = tube([[endP.x, endP.y, endP.z],
                    [endP.x + 1.1, endP.y + Math.cos(ang) * 0.9, endP.z + Math.sin(ang) * 0.75],
                    [bx2, by2, bz2]], 0.1, 0xc4b5fd, 14);
                    tG.add(br2.mesh);
                    var bou = new T.Mesh(new T.SphereGeometry(0.34, 14, 12), cell(0xa855f7));
                    bou.position.set(bx2, by2, bz2); tG.add(bou); M.boutons.push(bou);
                }

                /* ---------- SYNAPSE: next neuron's dendrite ---------- */
                var synG = new T.Group(); ctx.addPart(synG, 'synapse'); P.add(synG);
                var nextD = new T.Mesh(new T.SphereGeometry(1.5, 20, 16), cell(0x64748b, { transparent: true, opacity: 0.5 }));
                nextD.position.set(endP.x + 4.4, endP.y, endP.z); nextD.scale.set(0.7, 1, 1);
                synG.add(nextD);
                M.synDots = [];
                for (var v = 0; v < 8; v++) {
                    var dot = new T.Mesh(new T.SphereGeometry(0.11, 8, 6), cell(0x34d399));
                    dot.userData.p = Math.random();
                    synG.add(dot); M.synDots.push(dot);
                }
                M.endP = endP;

                /* ---------- travelling signal pulse ---------- */
                M.pulse = new T.Mesh(new T.SphereGeometry(0.42, 14, 12), cell(0xfde047));
                P.add(M.pulse);
                M.pulseT = 0;

                P.rotation.x = 0.12;
            },

            onFrame: function (t, ctx) {
                var M = ctx.model; if (!M.axonCurve) return;
                M.myG.visible = M.mye;
                M.nodeG.visible = M.mye;

                M.pulse.visible = M.sig;
                if (M.sig) {
                    // myelinated = fast & jumps node to node; unmyelinated = slow & continuous
                    var rate = (M.mye ? 0.0075 : 0.0022) * M.spd;
                    M.pulseT += rate;
                    if (M.pulseT > 1.35) M.pulseT = 0;
                    var u = Math.min(1, M.pulseT);
                    var p;
                    if (M.mye && M.nodeXs.length) {
                        // snap to the nearest node => visible "saltatory" hopping
                        var best = M.nodeXs[0], bd = 9;
                        M.nodeXs.forEach(function (n) { var d = Math.abs(n - u); if (d < bd) { bd = d; best = n; } });
                        p = M.axonCurve.getPoint(u < M.nodeXs[0] ? u : (u > M.nodeXs[M.nodeXs.length - 1] ? u : best));
                    } else {
                        p = M.axonCurve.getPoint(u);
                    }
                    M.pulse.position.copy(p);
                    M.pulse.scale.setScalar(1 + Math.sin(t * 18) * 0.18);
                    // boutons flash when the pulse arrives
                    var arrived = M.pulseT > 1;
                    M.boutons.forEach(function (b) { b.scale.setScalar(arrived ? 1.25 : 1); });
                    // neurotransmitters cross the synapse after arrival
                    M.synDots.forEach(function (d, i) {
                        d.visible = arrived;
                        if (!arrived) return;
                        var k = ((t * 1.6 + i * 0.14) % 1);
                        d.position.set(M.endP.x + 2.4 + k * 2.0,
                            M.endP.y + Math.cos(i) * 0.7 * (1 - k * 0.4),
                            M.endP.z + Math.sin(i) * 0.6 * (1 - k * 0.4));
                    });
                } else {
                    M.synDots.forEach(function (d) { d.visible = false; });
                }
            }
        });
    </script>
</body>

</html>
